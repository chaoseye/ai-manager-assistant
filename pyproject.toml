[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-manager-assistant"
version = "0.1.0"
description = "AI-помощник менеджера: ответ клиенту по базе знаний и подсказка по допродаже (amoCRM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "jinja2>=3.1",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
ai-assistant = "app.cli:main"

# Vercel: FastAPI-приложение как одна функция (см. vercel.json и README, раздел про Vercel).
[tool.vercel]
entrypoint = "app.main:app"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Кириллица в строках и комментариях — не ошибка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
