# Правила допродаж: когда → что предложить (id из products.yaml) → аргумент → скидка → когда нельзя.

- id: up-service-with-install
  when: Клиент покупает кондиционер с монтажом или уточняет цену и сроки монтажа.
  offer: [service-1y]
  argument: >-
    Фильтры и теплообменник нужно чистить раз в полгода, иначе падает мощность охлаждения
    и ухудшается воздух в комнате. Годовое обслуживание — две чистки, о сроках напоминаем сами.
  discount_percent: 20
  discount_condition: при заказе вместе с монтажом
  not_when: Клиент жалуется, торгуется по цене основного товара или уже отказался от обслуживания.

- id: up-purifier-allergy
  when: Клиент спрашивает про очистку воздуха или прямо говорит об аллергии на пыль, пыльцу или шерсть.
  offer: [air-purifier-mini]
  argument: >-
    Кондиционер охлаждает воздух, но не очищает его от мелкой пыли и пыльцы. Очиститель
    с HEPA-фильтром задерживает эти частицы.
  not_when: Клиент ограничен в бюджете и уже торгуется.

- id: up-inverter-upgrade
  when: Клиент спрашивает про шум, экономию электроэнергии или обогрев зимой.
  offer: [ac-inverter-09, ac-inverter-12]
  argument: Инверторные модели тише, на 25–30% экономичнее и греют до −15 °C.
  not_when: Клиент ограничен в бюджете, торгуется или осознанно выбрал модель Basic.

- id: up-wifi-inverter
  when: Клиент выбирает инверторную модель.
  offer: [wifi-module]
  argument: Можно включить кондиционер со смартфона по дороге домой и вернуться в прохладную квартиру.
  not_when: Клиент торгуется или выбрал модель Basic (модуль с ней несовместим).

- id: up-warranty-plus
  when: Клиент сомневается в надёжности, спрашивает про гарантию или поломки.
  offer: [warranty-plus-3y]
  argument: Продлевает гарантию на оборудование с 3 до 6 лет; ремонт в этот период бесплатный.
  not_when: Клиент жалуется на уже установленный кондиционер.

- id: up-dismantle
  when: Клиент упоминает старый кондиционер, который нужно заменить.
  offer: [install-dismantle]
  argument: Снимем старый кондиционер в тот же выезд — не нужно отдельно вызывать мастера.

- id: up-second-unit
  when: Клиент упоминает несколько комнат, торгуется или спрашивает о скидке.
  offer: [ac-basic-07, ac-basic-09]
  argument: При заказе двух кондиционеров действует скидка на оборудование.
  discount_percent: 5
  discount_condition: на оборудование при заказе от двух кондиционеров
  not_when: Клиент жалуется.

- id: up-after-sale-service
  when: Сделка уже закрыта успешно, а клиент пишет о работе кондиционера или спрашивает про чистку.
  offer: [service-1y, service-cleaning]
  argument: >-
    Регулярная чистка раз в полгода сохраняет мощность охлаждения; годовое обслуживание
    выгоднее двух разовых чисток.
  not_when: Клиент жалуется на качество монтажа — сначала закрыть претензию.
