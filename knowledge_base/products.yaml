# Товары и услуги. id — латиница в kebab-case, цена — целое число в рублях.
# unit указывается, только если цена не за штуку или услугу целиком.

- id: ac-basic-07
  name: Сплит-система Basic 07
  category: Кондиционеры
  price: 27900
  description: Кондиционер on/off для помещений до 18 м². Охлаждение и обогрев до −7 °C.
  for_whom: Небольшая спальня, детская или кабинет до 18 м².
  related: [install-standard, service-1y, warranty-plus-3y]

- id: ac-basic-09
  name: Сплит-система Basic 09
