- id: ac-inverter-09
  name: Инверторная сплит-система Inverter 09
  category: Кондиционеры
  price: 45900
  description: >-
    Инверторный кондиционер для помещений до 25 м². Работает тише и на 25–30% экономичнее
    моделей Basic, обогрев до −15 °C. Поддерживает Wi-Fi модуль.
  for_whom: Спальня или детская, где важны тишина и экономия; обогрев в межсезонье.
  related: [install-standard, wifi-module, service-1y, warranty-plus-3y]

- id: ac-inverter-12
  name: Инверторная сплит-система Inverter 12
  category: Кондиционеры
  price: 54900
  description: >-
    Инверторный кондиционер для помещений до 35 м². Работает тише и на 25–30% экономичнее
    моделей Basic, обогрев до −15 °C. Поддерживает Wi-Fi модуль.
  for_whom: Гостиная или кухня-гостиная, где важны тишина и экономия.
