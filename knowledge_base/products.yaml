- id: install-standard
  name: Стандартный монтаж
  category: Монтаж
  price: 9900
  description: >-
    Трасса до 3 м, установка внешнего блока под окном до 3-го этажа (выше — только с балкона
    или лоджии), вакуумирование системы, пуск и проверка работы.
  related: [install-extra-route, install-dismantle]

- id: install-extra-route
  name: Дополнительный метр трассы
  category: Монтаж
  price: 1500
  unit: за метр
  description: Если трасса между блоками длиннее 3 м.

- id: install-dismantle
  name: Демонтаж старого кондиционера
  category: Монтаж
  price: 3500
  description: Снятие старого внутреннего и внешнего блоков в тот же выезд, что и монтаж нового.

- id: service-cleaning
  name: Разовая чистка кондиционера
  category: Обслуживание
  price: 3900
  description: Чистка фильтров и теплообменника внутреннего блока, проверка работы.

- id: service-1y
  name: "Годовое обслуживание: 2 чистки фильтров и теплообменника"
  category: Обслуживание
  price: 5900
  description: Две выездные чистки в течение года в удобные даты; напоминаем о сроках сами.
  for_whom: Всем, кто покупает кондиционер с монтажом или уже пользуется кондиционером.

- id: warranty-plus-3y
  name: Расширенная гарантия +3 года
  category: Гарантия
  price: 4900
  description: Продлевает гарантию на оборудование с 3 до 6 лет.

- id: air-purifier-mini
  name: Очиститель воздуха Mini с HEPA-фильтром
  category: Очистка воздуха
  price: 12900
  description: Для помещений до 20 м². Задерживает мелкую пыль, пыльцу и шерсть животных.
  for_whom: Семьи с аллергиками и домашними животными.

- id: wifi-module
  name: Wi-Fi модуль
  category: Аксессуары
