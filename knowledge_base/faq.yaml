# Частые вопросы. questions — варианты формулировок, answer — ответ по сути.

- id: faq-choose-power
  questions:
    - какой кондиционер выбрать
    - какая мощность нужна
    - на какую площадь кондиционер
    - сколько метров комната
  answer: >-
    Подбираем по площади при потолках до 2,7 м: модели 07 — до 18 м², 09 — до 25 м², 12 — до 35 м².
    Для солнечной стороны или большого остекления берём модель на ступень мощнее.

- id: faq-inverter-diff
  questions:
    - чем отличается инверторный кондиционер
    - что такое инвертор
    - какой кондиционер тише
    - какой кондиционер экономичнее
  answer: >-
    Инверторный кондиционер плавно меняет мощность, а не включается и выключается целиком: работает
    тише, на 25–30% экономичнее по электроэнергии, точнее держит температуру и греет до −15 °C.
    Модели Basic дешевле и подходят для сезонного охлаждения.

- id: faq-install-time
  questions:
    - когда приедете
    - сроки монтажа
    - как быстро установите
    - когда будет установка
  answer: >-
    Выезд мастера — в течение 1–3 рабочих дней после оплаты оборудования, точную дату и время
    согласуем с клиентом.

- id: faq-install-duration
  questions:
    - сколько длится монтаж
    - сколько времени занимает установка
    - как долго устанавливать
  answer: Стандартный монтаж занимает 3–4 часа.

- id: faq-install-clean
  questions:
    - будет ли грязь при монтаже
    - будет ли пыль
    - уборка после монтажа
  answer: Мастера работают с защитной плёнкой и строительным пылесосом, после работ убирают за собой.

- id: faq-cooling-worse
  questions:
    - кондиционер стал хуже охлаждать
    - плохо холодит
    - не охлаждает
    - дует теплым воздухом
  answer: >-
    Чаще всего причина — загрязнённые фильтры и теплообменник: их рекомендуется чистить раз в полгода,
    поможет чистка кондиционера. Если после чистки охлаждение не восстановилось, мастер проведёт
    диагностику; в гарантийный период выезд на диагностику бесплатный.

- id: faq-own-unit
  questions:
    - установите мой кондиционер
    - купил кондиционер в другом магазине
    - нужен только монтаж
  answer: >-
    Да, устанавливаем кондиционеры, купленные в других магазинах, по тем же ценам на монтаж.
    Гарантия на монтаж — 1 год, гарантию на оборудование в этом случае даёт продавец.

- id: faq-heating
  questions:
    - работает ли на обогрев
    - можно ли греть зимой
    - обогрев кондиционером
  answer: "Все модели работают на обогрев: Basic — при температуре на улице до −7 °C, Inverter — до −15 °C."

- id: faq-noise
  questions:
    - кондиционер шумит
    - громкий ли кондиционер
    - уровень шума
  answer: >-
    Инверторные модели работают тише моделей Basic. Если после установки кондиционер начал шуметь
    или вибрировать, мастер приедет и проверит крепления.
