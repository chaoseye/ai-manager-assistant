# Условия работы: оплата, доставка, гарантия, скидки, возврат, претензии.

- id: pol-payment
  title: Оплата
  text: >-
    Оборудование оплачивается при заказе: картой на сайте, по ссылке на оплату или банковским
    переводом для юрлиц. Монтаж оплачивается после выполнения работ — картой или наличными мастеру.

- id: pol-delivery
  title: Доставка
  text: >-
    При заказе с монтажом доставка по зоне обслуживания бесплатная, оборудование привозит мастер.
    Без монтажа — доставка 990 ₽, в течение 1–2 рабочих дней после оплаты.

- id: pol-area
  title: Зона обслуживания
  text: >-
    Москва и Подмосковье до 30 км от МКАД. Дальше — доплата 50 ₽ за каждый километр сверх 30 км.

- id: pol-warranty
  title: Гарантия
  text: >-
    Гарантия на оборудование — 3 года, на монтаж — 1 год. Расширенная гарантия продлевает гарантию
    на оборудование до 6 лет. Гарантийный ремонт и выезд на диагностику в гарантийный период бесплатны.

- id: pol-discounts
  title: Скидки
  text: >-
    Скидка 5% на оборудование при заказе от двух кондиционеров. Скидка 20% на годовое обслуживание
    при заказе вместе с монтажом. Других скидок и акций нет; менеджер не обещает скидки сверх этого
    без согласования с руководителем.

- id: pol-return
  title: Возврат
  text: >-
    Вернуть оборудование надлежащего качества можно в течение 7 дней после получения, если оно
    не устанавливалось и сохранены упаковка и комплектность.

- id: pol-complaints
  title: Претензии к монтажу
  text: >-
    Извиняемся перед клиентом, фиксируем претензию и в течение 2 рабочих дней направляем старшего
    мастера. Недочёты монтажа устраняем за наш счёт. Вопросы компенсации решает руководитель
    после разбора.
