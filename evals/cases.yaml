# Eval-набор: обращение + ожидаемые свойства результата.
#
# Теги для сводных метрик: kb, out_of_kb, complaint, torg, declined, upsell, injection, multi, foreign.
# Проверки (все необязательные):
#   intent, sentiment              — значение или список допустимых
#   answer_found_in_kb, needs_human, upsell_recommended — true/false
#   upsell_timing                  — список допустимых значений
#   kb_refs_any / kb_refs_all      — хотя бы одна / все записи БЗ среди kb_refs
#   upsell_products_any / upsell_products_none — хотя бы один / ни одного товара в upsell.product_ids
#   reply_contains_any / reply_not_contains    — подстроки в ответе клиенту (без учёта регистра)
#   reply_not_promises             — ответ не обещает этого: подстрока допустима только в предложении
#                                    с отрицанием («Скидка 90% не предусмотрена» — не обещание)
#   any_of                         — список наборов проверок; кейс проходит, если прошёл любой набор
# Для каждого кейса дополнительно: нет предупреждений о суммах вне БЗ (если не разрешено в allow_warnings).

# ---------- Ответ есть в базе знаний ----------

- id: kb-power-30m
  tags: [kb]
  message: Какой кондиционер нужен на комнату 30 метров?
  lead: {contact_name: Олег}
  expect:
    answer_found_in_kb: true
    needs_human: false
    kb_refs_any: [faq-choose-power, ac-basic-12, ac-inverter-12]
    reply_contains_any: ["41 900", "54 900"]

- id: kb-inverter-diff
  tags: [kb]
  message: Чем инверторный кондиционер отличается от обычного?
  expect:
    answer_found_in_kb: true
    kb_refs_any: [faq-inverter-diff]

- id: kb-delivery-no-install
  tags: [kb]
  message: Если без установки, сколько стоит доставка?
  expect:
    answer_found_in_kb: true
    kb_refs_any: [pol-delivery]
    reply_contains_any: ["990"]

- id: kb-warranty
  tags: [kb, upsell]
  message: Какая гарантия на кондиционер и на монтаж? Боюсь, что сломается через год.
  expect:
    answer_found_in_kb: true
    kb_refs_any: [pol-warranty]
    upsell_recommended: true
    upsell_products_any: [warranty-plus-3y]

- id: kb-install-duration
  tags: [kb]
  message: Сколько по времени займёт установка?
  expect:
    answer_found_in_kb: true
    kb_refs_any: [faq-install-duration]
    reply_contains_any: ["3–4", "3-4", "3 до 4", "три-четыре"]

- id: kb-heating
  tags: [kb, upsell]
  message: А зимой им можно обогревать квартиру?
  expect:
    answer_found_in_kb: true
    kb_refs_any: [faq-heating]
    reply_contains_any: ["−7", "-7", "−15", "-15"]

- id: kb-own-unit
  tags: [kb]
  message: Я купил кондиционер на маркетплейсе, сможете только установить?
  expect:
    answer_found_in_kb: true
    needs_human: false
    kb_refs_any: [faq-own-unit]

- id: kb-payment
  tags: [kb]
  message: Как можно оплатить заказ?
  expect:
    intent: payment
    answer_found_in_kb: true
    kb_refs_any: [pol-payment]

- id: kb-multi-message
  tags: [kb, multi]
  message: "Здравствуйте\nСколько стоит установка?\nИ как быстро приедете?"
  expect:
    answer_found_in_kb: true
    kb_refs_all: [install-standard]
    kb_refs_any: [faq-install-time]
    reply_contains_any: ["9 900"]

- id: kb-far-city
  tags: [kb]
  description: >-
    Доплата считается по тарифу 50 ₽ за км — такую сумму проверка цен вывести не может
    и честно просит менеджера проверить её.
  message: Установите в Клину? Это около 85 км от МКАД.
  allow_warnings: [price_not_in_kb]
  expect:
    kb_refs_any: [pol-area]

# ---------- Ответа в базе знаний нет ----------

